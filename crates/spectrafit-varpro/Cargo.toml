[package]
name = "spectrafit-varpro"
description = "Variable Projection (VarPro) solver for separable nonlinear models."
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[dependencies]
spectrafit-types = { workspace = true }
spectrafit-models = { workspace = true }
spectrafit-graph = { workspace = true }
nalgebra = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
varpro = { workspace = true, features = ["lapack-accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
varpro = { workspace = true, features = ["lapack-netlib"] }

[dev-dependencies]
approx = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
