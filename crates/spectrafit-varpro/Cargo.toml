[package]
name = "spectrafit-varpro"
description = "Variable Projection (VarPro) solver for separable nonlinear models."
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[dependencies]
spectrafit-types = { workspace = true }
spectrafit-models = { workspace = true }
spectrafit-graph = { workspace = true }
nalgebra = { workspace = true }

# LAPACK backend per platform. macOS links Apple Accelerate; Linux builds
# netlib LAPACK from source. Windows gets NO lapack feature: `netlib-src` needs a
# Fortran compiler the Windows wheel runners do not have, and varpro's pure-Rust
# nalgebra backend compiles and passes this crate's tests without one.
[target.'cfg(target_os = "macos")'.dependencies]
varpro = { workspace = true, features = ["lapack-accelerate"] }

[target.'cfg(target_os = "linux")'.dependencies]
varpro = { workspace = true, features = ["lapack-netlib"] }

[target.'cfg(not(any(target_os = "macos", target_os = "linux")))'.dependencies]
varpro = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
