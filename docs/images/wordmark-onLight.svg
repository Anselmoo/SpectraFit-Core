<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64"><defs>
<linearGradient id="wl-base" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4FA8FF"></stop><stop offset="60%" stop-color="#0A84FF"></stop><stop offset="100%" stop-color="#0768D1"></stop></linearGradient>
