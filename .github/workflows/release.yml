name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build ${{ matrix.os }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One wheel per supported CPython (requires-python >=3.13): 3.13 and
        # 3.14. Linux/macOS name the interpreters explicitly; on Windows
        # setup-python installs exactly these two and --find-interpreter picks
        # them up through the py launcher.
        include:
          - os: ubuntu-latest
            target: x86_64
            interpreters: -i python3.13 python3.14
          - os: macos-latest
            target: universal2-apple-darwin
            interpreters: -i python3.13 python3.14
          - os: windows-latest
            target: x86_64
            interpreters: --find-interpreter
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: |
            3.13
            3.14

      - name: Set up uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist ${{ matrix.interpreters }}
          sccache: true
          # manylinux_2_28 (AlmaLinux 8): `auto` resolved to manylinux2014
          # (CentOS 7), whose cmake 2.8 / gfortran 4.8 cannot build netlib
          # LAPACK. Only the ubuntu leg runs inside this container;
          # maturin-action ignores before-script-linux for macOS/Windows.
          # crates/spectrafit-varpro uses `lapack-netlib` on Linux (needs
          # Fortran + cmake), Accelerate on macOS and pure-Rust nalgebra on
          # Windows, so only Linux needs a toolchain here.
          manylinux: "2_28"
          before-script-linux: |
            dnf install -y gcc-gfortran cmake

      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist-wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  build:
    name: Merge distributions
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Download all distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Set up uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Upload merged distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: python-package-distributions
          path: dist/*

  version-guard:
    name: Version guard (metadata == tag)
    needs: build
    # Every upload job below depends on this one. It reads the version from
    # the distributions' own metadata (wheel METADATA, sdist PKG-INFO) --
    # never from file names -- and refuses to go on unless every artifact
    # carries exactly the tagged version. Tag first and bump later, and this
    # job stops the run before anything reaches an index.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.guard.outputs.version }}
      is_prerelease: ${{ steps.guard.outputs.is_prerelease }}
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Install packaging
        run: python -m pip install packaging

      - name: Compare distribution metadata with the tag
        id: guard
        env:
          EXPECTED_TAG: ${{ github.ref_name }}
        shell: python
        run: |
          import email.parser
          import os
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          from packaging.version import Version

          expected = os.environ["EXPECTED_TAG"].removeprefix("v")
          parser = email.parser.HeaderParser()


          def top_level(names, suffix):
              hits = [n for n in names if n.count("/") == 1 and n.endswith(suffix)]
              if len(hits) != 1:
                  sys.exit(f"::error::expected exactly one top-level *{suffix}, found {hits}")
              return hits[0]


          def wheel_version(path):
              with zipfile.ZipFile(path) as zf:
                  name = top_level(zf.namelist(), ".dist-info/METADATA")
                  return parser.parsestr(zf.read(name).decode())["Version"]


          def sdist_version(path):
              with tarfile.open(path) as tf:
                  name = top_level(tf.getnames(), "/PKG-INFO")
                  return parser.parsestr(tf.extractfile(name).read().decode())["Version"]


          dist = Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          if not wheels or len(sdists) != 1:
              sys.exit(f"::error::need >=1 wheel and exactly 1 sdist, got {len(wheels)} wheel(s), {len(sdists)} sdist(s)")

          found = {p.name: wheel_version(p) for p in wheels}
          found.update({p.name: sdist_version(p) for p in sdists})
          for name, version in found.items():
              print(f"{version:<16} {name}")

          mismatched = {n: v for n, v in found.items() if v != expected}
          if mismatched:
              sys.exit(
                  f"::error::tag {os.environ['EXPECTED_TAG']} expects version {expected!r}, "
                  f"but these artifacts carry another one: {mismatched}. "
                  "Bump the version first (rrt, GitLab MR, sync), then tag the "
                  "canonical PEP 440 spelling (e.g. v0.1.0rc1)."
              )

          is_prerelease = Version(expected).is_prerelease
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={expected}\n")
              fh.write(f"is_prerelease={'true' if is_prerelease else 'false'}\n")
          print(f"version={expected} is_prerelease={is_prerelease}")

  sbom:
    name: Generate SBOM
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          path: .

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom
          path: sbom.spdx.json

  attest:
    name: Attest build provenance
    needs: [build, version-guard]
    # actions/attest-build-provenance publishes a real attestation tied to
    # this repo, which is more than "just the CI run" -- skip it on the
    # tag-free workflow_dispatch build dry run (github.ref never starts with
    # refs/tags/v for workflow_dispatch, so this is also naturally guarded).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-path: dist/*

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, sbom, attest, version-guard]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/spectrafit-core
    permissions:
      id-token: write  # for trusted publishing
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        # Trusted publishing (OIDC): no token/password is passed.
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-testpypi:
    name: Verify TestPyPI package (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: publish-testpypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create a fresh virtual environment
        run: python -m venv .venv-verify

      - name: Install from TestPyPI with retries
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then
            source .venv-verify/Scripts/activate
          else
            source .venv-verify/bin/activate
          fi
          python -m pip install --upgrade pip
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          for attempt in {1..8}; do
            if python -m pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "spectrafit-core==${VERSION}"; then
              break
            fi
            if [ "$attempt" -eq 8 ]; then
              echo "Package was not installable from TestPyPI after retries."
              exit 1
            fi
            echo "Retrying TestPyPI install in 20s (attempt ${attempt}/8)..."
            sleep 20
          done

      - name: Smoke test (README quick-start)
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then
            source .venv-verify/Scripts/activate
          else
            source .venv-verify/bin/activate
          fi
          python -c "import spectrafit_core"
          python -c "
          import numpy as np
          from spectrafit_core import MeasurementData, compose, fit, gaussian

          x = np.linspace(-5, 5, 200)
          y = 3.0 * np.exp(-0.5 * ((x - 0.5) / 1.2) ** 2) + np.random.default_rng(0).normal(
              0, 0.05, x.size
          )
          graph = compose([gaussian('peak1', amplitude=1.0, center=0.0, sigma=1.0)]).build()
          result = fit(graph, MeasurementData(x=x.tolist(), y=y.tolist()))
          assert result.r_squared > 0.99, f'r_squared too low: {result.r_squared}'
          print('r_squared', result.r_squared)
          "

  publish-pypi:
    name: Publish to PyPI
    needs: [verify-testpypi, version-guard]
    # Final releases only -- a PEP 440 pre-release (as decided by
    # packaging.version.Version.is_prerelease in version-guard, from the
    # artifacts' own metadata) stops at TestPyPI verification and goes out
    # only as a GitHub prerelease.
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      needs.version-guard.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/spectrafit-core
    permissions:
      id-token: write  # for trusted publishing
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        # Trusted publishing (OIDC): the action authenticates via the job's
        # id-token permission above -- no password/secret. A PyPI trusted
        # publisher must be configured for spectrafit-core (project ->
        # publishing) so this repo+workflow is allowed to upload.
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1

  github-release:
    name: Create GitHub Release
    needs: [sbom, verify-testpypi, publish-pypi, version-guard]
    # publish-pypi is skipped (not failed) for pre-releases -- accept either
    # 'success' or 'skipped' for it, but require version-guard, sbom and
    # verify-testpypi to have actually succeeded.
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.version-guard.result == 'success' &&
      needs.sbom.result == 'success' &&
      needs.verify-testpypi.result == 'success' &&
      (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Download SBOM artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: sbom
          path: .

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            dist/*
            sbom.spdx.json
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ needs.version-guard.outputs.is_prerelease }}
