name: Docs & Pages

# Builds the Zensical docs site (+ generated rustdoc + the tutorial gallery)
# and deploys it to GitHub Pages, mirroring GitLab Pages' /docs/ publish
# (.gitlab/65-docs.yml + .gitlab/60-pages.yml). This workflow owns ONLY the
# docs site + carrying forward the latest benchmark report.html — it does
# NOT re-run the benchmark itself (that stays benchmark.yml's job, weekly).
#
# 2026-08-03 incident (see DECISIONS.md CI entries for 2026-08-04): this
# workflow's first-ever real run deployed the Performance page's "no data
# yet" placeholder because its own dispatched bootstrap benchmark.yml run
# hadn't finished when the discovery-poll gave up (old 5 min budget), and
# nothing re-triggered a rebuild once that run DID succeed 50 min later
# (`benchmark.yml` only got a direct `gh workflow run docs-pages.yml`
# dispatch-on-success step after this incident, plus a wider 10 min poll
# budget here). A successful `benchmark.yml` run + its `benchmark-report-latest`
# artifact already exist on this mirror as of that incident, so the very next
# push-triggered run of this workflow should pick them up immediately via the
# `RUN_ID` lookup below, without needing the dispatch-fallback path at all.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Benchmark"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write
  # Needed only by the benchmark-manifest fetch step's fallback path, which
  # dispatches + watches a `benchmark.yml` run via `gh workflow run`/`gh run
  # watch` when no successful run exists yet on this mirror.
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # ci-job-timeout-declaration: compiles the extension itself (dev profile),
    # then cargo doc, the gallery renderer, zensical build, and the internal
    # link-resolution gate. GitLab's build:docs is 5.6 min post-compile-once
    # (pipeline 363865) but reuses a shared artifact this job does not have.
    # Budget raised 30 -> 75 min to cover the benchmark-manifest fetch step's
    # fallback path: up to ~5 min polling for the dispatched run to appear,
    # plus up to a 40 min watch budget for a reps=1 `benchmark.yml` run.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        with:
          enable-cache: true

      - name: Cache Cargo artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          # Namespaced fallback: this block caches `target/`, and a bare
          # `-cargo-` prefix matches EVERY profile's entry, so it could restore
          # the instrumented or release tree that the key's own `-cargo-docs-`
          # namespace exists to keep out.
          restore-keys: |
            ${{ runner.os }}-cargo-docs-

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable  # rolling ref by design: tracks latest stable Rust toolchain, do not SHA-pin

      - name: Install LAPACK (for varpro on Linux)
        run: sudo apt-get install -y liblapack-dev libopenblas-dev

      - name: Sync dependencies
        # "docs" is a [dependency-groups] entry, not a [project.optional-dependencies]
        # extra — installed via --group, not --extra (see zensical.toml's header
        # comment / DECISIONS.md 2026-07-26 for why this distinction matters here).
        run: uv sync --group docs

      - name: Build the PyO3 extension
        # mkdocstrings needs the real compiled spectrafit_core importable to
        # introspect docstrings — dev build is enough, no --release needed for docs.
        run: uv run maturin develop

      # Mirrors .gitlab/65-docs.yml's missing_docs hard gate. 7 of 11 crates
      # enforce #![warn(missing_docs)] and the trust-region family was brought
      # to the same bar, so a new pub item landing without a doc comment must
      # fail here rather than silently ship an incomplete rustdoc page. grep for
      # "missing_docs" specifically, not any warning, so unrelated
      # dependency/deprecation warnings from crates.io deps don't fail the job.
      - name: Generate Rust API docs (rustdoc)
        run: |
          cargo doc --workspace --no-deps 2>&1 | tee cargo-doc.log
          if grep -qi "missing_docs" cargo-doc.log; then
            echo "::error::cargo doc reported missing_docs warnings — see the log above"
            exit 1
          fi

      - name: Render the tutorial gallery
        run: uv run python docs/tutorials/gallery/_render.py

      - name: Fetch (or produce) the latest benchmark report.html + manifest.json
        # Best-effort: carries forward the last successful benchmark.yml run's
        # report.html (+ manifest.json, for the "Current performance" docs
        # page) so every Pages deploy has SOME data available, not just
        # deploys that happen to follow a benchmark run.
        #
        # Fallback: benchmark.yml is weekly-cron + manual-dispatch only, so a
        # fresh mirror (or a run-history reset) can have genuinely zero
        # successful runs to pick up — the old `--status=success --limit=1`
        # query then always finds nothing here, even once benchmark.yml has
        # run successfully many times on GitLab. When that happens, this step
        # now dispatches a fast (reps=1) benchmark.yml run itself and waits
        # (bounded) for it, rather than shipping the performance page with a
        # permanent no-data placeholder. This trades a slower Pages deploy
        # (only on the runs that hit this path) for real data — the tradeoff
        # was deliberately chosen over leaving the page empty. Still never
        # fails the overall build either way: any failure/timeout in the
        # fallback just leaves both files absent, and the site builds
        # accordingly (report.html link omitted, performance page renders its
        # no-data placeholder).
        #
        # Download-only here — deliberately NOT copied into site/ yet. This
        # step used to `cp` report.html into site/report.html at this point,
        # but that ran *before* the "Build docs site (Zensical)" step below,
        # which runs `zensical build --clean` and wipes site/ first — silently
        # deleting the just-placed report.html before the Pages upload ever
        # saw it (mirrors GitLab's `pages` job in .gitlab/60-pages.yml, which
        # copies report.html into public/ only *after* the docs site copy for
        # the same reason). The actual copy now happens in a later step, after
        # the Zensical build has already run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p /tmp/benchmark-report

          # --status=completed + an explicit conclusion filter (rather than
          # --status=success) so a run that partially failed but still
          # uploaded benchmark-report-latest isn't silently skipped;
          # --branch main keeps PR-dispatched runs out of the pickup.
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=benchmark.yml \
            --branch main --status=completed --limit=20 --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion=="success")][0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "No successful benchmark.yml run found on main — dispatching a fast (reps=1) one now."
            DISPATCH_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            if gh workflow run benchmark.yml --repo "$GITHUB_REPOSITORY" --ref main -f reps=1; then
              # workflow_dispatch is fire-and-forget and returns no run id, and
              # the new run is not always immediately visible in `gh run list`
              # (API eventual-consistency lag) — a short settle delay before the
              # first poll avoids burning an attempt on a guaranteed-empty read.
              # 2026-08-03 incident: the old 30x10s (5 min) budget gave up
              # before the run ever became visible, so this step silently
              # "continued without data" even though the dispatched run went on
              # to succeed less than an hour later. Raised to 40x15s (10 min) —
              # still well inside this job's 75 min ci-job-timeout-declaration
              # budget, which already assumed up to 5 min here.
              sleep 15
              NEW_RUN_ID=""
              for _ in $(seq 1 40); do
                # shellcheck disable=SC2016  # $since is a jq --arg variable, not a shell one — single-quoting is intentional
                NEW_RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=benchmark.yml \
                  --branch main --limit=5 --json databaseId,createdAt \
                  --jq --arg since "$DISPATCH_TIME" \
                  '[.[] | select(.createdAt >= $since)] | sort_by(.createdAt) | .[0].databaseId')
                [ -n "$NEW_RUN_ID" ] && break
                sleep 15
              done
              if [ -n "$NEW_RUN_ID" ]; then
                echo "Waiting (up to 40 min) on dispatched benchmark run $NEW_RUN_ID..."
                if timeout 2400 gh run watch "$NEW_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status; then
                  RUN_ID="$NEW_RUN_ID"
                else
                  echo "Dispatched run did not succeed within the wait budget — continuing without data."
                fi
              else
                echo "Dispatched benchmark.yml but could not locate its run — continuing without data."
              fi
            else
              echo "Could not dispatch benchmark.yml (missing permission or API error) — continuing without data."
            fi
          fi

          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name benchmark-report-latest --dir /tmp/benchmark-report
          fi

          # Bug found + fixed 2026-08-04, before it ever shipped: benchmark.yml
          # uploads this artifact from TWO glob patterns
          # (.spectrafit_reports/benchmark/**/{report.html,manifest.json}), so
          # upload-artifact's least-common-ancestor trimming keeps the run's
          # own `<run_id>/` leaf directory rather than flattening to the
          # artifact root — `gh run download --name ... --dir X` lands the
          # files at `X/<run_id>/report.html`, NOT `X/report.html`. Every
          # downstream step below assumed the flat path, which would have
          # silently rendered the "no data yet" placeholder and skipped the
          # report.html copy on EVERY run, successful download or not.
          # Resolved dynamically via `find`, matching the coverage-atlas/
          # web-bundle fetch step further down, which already gets this right.
          REPORT_HTML=$(find /tmp/benchmark-report -name report.html 2>/dev/null | head -1)
          MANIFEST_JSON=$(find /tmp/benchmark-report -name manifest.json 2>/dev/null | head -1)
          if [ -n "$REPORT_HTML" ]; then
            echo "BENCHMARK_REPORT_HTML=$REPORT_HTML" >> "$GITHUB_ENV"
            echo "Found report.html at $REPORT_HTML"
          else
            echo "No weekly report.html available — skipping (site builds without it)"
          fi
          if [ -n "$MANIFEST_JSON" ]; then
            echo "BENCHMARK_MANIFEST_JSON=$MANIFEST_JSON" >> "$GITHUB_ENV"
            echo "Found manifest.json at $MANIFEST_JSON"
          fi
          exit 0

      # GitHub builds the coverage atlas and web bundle but never publishes them,
      # while GitLab publishes both. Fetch them from the latest CI run and carry
      # forward into the Pages site (matching .gitlab/60-pages.yml behavior).
      - name: Fetch the latest CI coverage atlas + web bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p /tmp/ci-artifacts
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=ci.yml \
            --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --dir /tmp/ci-artifacts
          fi
          # `gh run download` with --dir and no --name creates one subdirectory
          # per artifact, named after the artifact. Probe with `find`, not a
          # glob inside `[ -f ]` — an unmatched glob stays literal and a
          # multi-match one makes `[` fail with "too many arguments".
          [ -n "$(find /tmp/ci-artifacts -name coverage-atlas-fused.html 2>/dev/null)" ] \
            || echo "No coverage atlas available yet — skipping (site builds without it)"
          [ -n "$(find /tmp/ci-artifacts -maxdepth 1 -type d -name 'web-report-*' 2>/dev/null)" ] \
            || echo "No web bundle available yet — skipping (site builds without it)"
          exit 0

      - name: Render the current-performance docs page
        env:
          BENCHMARK_MANIFEST_PATH: ${{ env.BENCHMARK_MANIFEST_JSON }}
        run: uv run python docs/_render_benchmark_summary.py

      - name: Build docs site (Zensical)
        run: uv run zensical build --clean

      # Mirrors the same gate in .gitlab/65-docs.yml. It has to live in a job
      # that builds site/ — the test skips when site/ is absent, and ci.yml's
      # pytest job never builds the docs, which is how it silently skipped in
      # every pipeline after being added.
      - name: Internal link resolution gate
        run: PYTHONPATH=python uv run pytest tests/audit/test_audit_built_site_links.py -q

      - name: Copy the fetched report.html into the built site
        # Must run after the Zensical build above (`--clean` wipes site/ on
        # every run) — see the fetch step's comment for why this was
        # previously silently dropped. Path comes from BENCHMARK_REPORT_HTML,
        # resolved via `find` in the fetch step (see that step's comment for
        # why the flat /tmp/benchmark-report/report.html path was wrong).
        run: |
          if [ -n "${BENCHMARK_REPORT_HTML:-}" ] && [ -f "$BENCHMARK_REPORT_HTML" ]; then
            cp "$BENCHMARK_REPORT_HTML" site/report.html
            echo "Copied fetched report.html -> site/report.html"
          fi

      - name: Copy generated rustdoc into the site
        run: |
          mkdir -p site/reference/rust/rustdoc
          cp -r target/doc/. site/reference/rust/rustdoc/
          echo "Copied rustdoc -> site/reference/rust/rustdoc/ ($(find site/reference/rust/rustdoc -type f | wc -l) files)"

      # Copy coverage atlas + web bundle from CI artifacts into the site.
      # Must run after the Zensical build (which wipes site/), same as report.html.
      # Mirrors .gitlab/60-pages.yml's publish pattern: coverage atlas goes to
      # site/reports/coverage-atlas.html, web bundle to site/web/.
      - name: Copy coverage atlas + web bundle into the site
        run: |
          set +e
          mkdir -p site/reports site/web
          ATLAS=$(find /tmp/ci-artifacts -name "coverage-atlas-fused.html" 2>/dev/null | head -1)
          if [ -n "$ATLAS" ] && [ -f "$ATLAS" ]; then
            cp "$ATLAS" site/reports/coverage-atlas.html
            echo "Copied coverage atlas -> site/reports/coverage-atlas.html ($(du -h site/reports/coverage-atlas.html | cut -f1))"
          else
            echo "No coverage atlas available — skipping"
          fi
          # ci.yml uploads this as `path: web/dist`, and upload-artifact stores
          # files relative to the least-common-ancestor of `path` — so the
          # artifact's ROOT *is* web/dist's contents; there is no nested
          # `web/dist` directory inside it. Locate by artifact-directory name.
          # (A `-path "*/web/dist"` probe matches nothing here and would make
          # this step print a tidy "skipping" forever while publishing nothing.)
          WEB_DIST=$(find /tmp/ci-artifacts -maxdepth 1 -type d -name 'web-report-*' 2>/dev/null | head -1)
          if [ -n "$WEB_DIST" ] && [ -d "$WEB_DIST" ]; then
            cp -r "$WEB_DIST"/. site/web/
            echo "Copied web bundle -> site/web/ ($(find site/web -type f | wc -l) files)"
          else
            echo "No web bundle available — skipping"
          fi
          exit 0

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
        id: deployment
