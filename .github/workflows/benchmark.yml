name: Benchmark

on:
  schedule:
    - cron: '0 3 * * 1'  # Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      reps:
        description: 'Timing repetitions per case'
        default: '10'
        required: false

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed only by the final "Trigger docs rebuild" step, which calls
  # `gh workflow run docs-pages.yml` on success.
  actions: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # ci-job-timeout-declaration: compiles --release, then the full benchmark
    # at the reps count given by workflow_dispatch (default 10). GitLab's
    # deep-bench cost model (.gitlab/55-deep-bench.yml) estimates reps=10 at
    # ~25 min of timed solve alone, on top of a real compile here.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        with:
          enable-cache: true

      - name: Cache Cargo artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Profile-namespaced, matching -cargo-lint- / -cargo-docs- /
          # -cargo-precommit- elsewhere. This job builds `maturin develop
          # --release` (:55), so it shares -cargo-release- with ci.yml's
          # regression-gate / regression-gate-solo — that reuse is intended.
          # What must NOT be shared is ci.yml's build-and-test tree, which is
          # llvm-cov-instrumented: a `target/` compiled under a different
          # RUSTC_WRAPPER/RUSTFLAGS cannot be reused, so a bare `-cargo-` key
          # made the two profiles race for one cache entry. `restore-keys` is
          # namespaced too — a bare `-cargo-` prefix would restore the very
          # tree this split exists to avoid.
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable  # rolling ref by design: tracks latest stable Rust toolchain, do not SHA-pin

      - name: Install LAPACK (for varpro on Linux)
        run: sudo apt-get install -y liblapack-dev libopenblas-dev

      - name: Sync dependencies
        # Weekly run includes jax (the third backend in the full report).
        run: uv sync --extra benchmark --extra jax

      - name: Build extension (release profile for fair timing)
        run: uv run maturin develop --release

      - name: Run benchmark (emits results.json + manifest.json)
        env:
          REPS: ${{ github.event.inputs.reps || '10' }}
        run: PYTHONPATH=python uv run python -m oracles.cli run --reps "$REPS" --mc 30

      - name: Regression gate (spectrafit vs lmfit)
        # Two-phase gate: first the structured JSON for the GH Actions summary
        # (and the artifact uploaded below — exit ignored so we always emit
        # the breakdown), then the human-readable run that decides job status.
        run: |
          set +e
          PYTHONPATH=python uv run python -m oracles.cli gate --json \
            | tee gate.json
          set -e
          if [ -s gate.json ]; then
            {
              echo "### Benchmark gate"
              echo ""
              echo '```json'
              cat gate.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          PYTHONPATH=python uv run python -m oracles.cli gate

      - name: Build self-contained report.html
        run: PYTHONPATH=python uv run poe bundle_report_only

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: benchmark-${{ github.sha }}
          # The run-centric tree: results.json + manifest.json + report.html.
          path: .spectrafit_reports/benchmark/**
          retention-days: 90

      - name: Upload report.html
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: benchmark-report-${{ github.sha }}
          path: .spectrafit_reports/benchmark/**/report.html
          retention-days: 90
          if-no-files-found: warn

      # Stable-named duplicate (fixed name, no per-run suffix) so the
      # docs-pages.yml workflow can fetch "the latest report.html" via
      # `gh run list --workflow=benchmark.yml` + `gh run download` without
      # needing to know this run's SHA in advance. Short retention since it's
      # only ever consumed immediately by the next docs-pages.yml run, not
      # browsed by humans (the SHA-suffixed upload above is the durable one).
      # Also carries manifest.json (docs-pages.yml points
      # docs/_render_benchmark_summary.py's BENCHMARK_MANIFEST_PATH at it) —
      # small enough to bundle with report.html rather than a third artifact.
      - name: Upload report.html + manifest.json (stable name, for docs-pages.yml pickup)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: benchmark-report-latest
          path: |
            .spectrafit_reports/benchmark/**/report.html
            .spectrafit_reports/benchmark/**/manifest.json
          retention-days: 14
          if-no-files-found: warn
          overwrite: true

      # Root cause (2026-08-03 incident): docs-pages.yml also declares
      # `on: workflow_run: workflows: ["Benchmark"] types: [completed]`, but
      # that listener never actually fired for this workflow's first-ever
      # run — GitHub Actions' documented anti-recursion behavior exempts
      # workflow_dispatch calls made with the default GITHUB_TOKEN (exactly
      # how docs-pages.yml's own bootstrap fallback dispatches this
      # workflow) from reliably cascading into a NEW workflow_run event on
      # every account/App-token configuration, so the listener cannot be
      # trusted as the only path. Dispatching docs-pages.yml directly here
      # (a plain workflow_dispatch API call, not a chained event) sidesteps
      # that ambiguity entirely. Safe against a dispatch loop: docs-pages.yml
      # only self-dispatches THIS workflow when no successful run exists yet
      # (`.github/workflows/docs-pages.yml`'s `[ -z "$RUN_ID" ]` guard) — by
      # the time this step runs, one always does, so the run this step
      # triggers finds it immediately and never re-dispatches.
      - name: Trigger docs rebuild (fresh benchmark data is now available)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
