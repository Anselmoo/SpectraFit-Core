# IBM Plex Sans + JetBrains Mono self-hosted webfonts (SpectraFit Design System
# re-skin, commit 46dd67f6). NOT a byte-for-byte vendoring of an upstream
# release artifact: `web/src/style/fonts.css`'s own header comment records the
# source as the `google/fonts` GitHub repo's `ofl/ibmplexsans/` and
# `ofl/jetbrainsmono/` variable TTFs, "instanced to static weights and
# converted to woff2 locally" — i.e. these 9 files are a LOCAL DERIVATIVE, like
# `katex-css` above, not a copy of any single upstream download. `docs/fonts/`
# reuses the exact same bytes already vendored under `web/src/style/fonts/`
# (confirmed identical by sha256, no re-fetch) — see DECISIONS-archive.md's
# 2026-07-28 entry.
#
# Left deliberately unverified rather than guessed: `google/fonts` ships no
# static woff2 for either family (only the variable TTF that was instanced),
# so there is no single upstream URL whose bytes this file could ever match,
# and no commit/tag in this repo's history records which `google/fonts`
# revision the instancing was run against. `url` is omitted rather than
# pointing at a plausible-but-unconfirmed commit — `version = "unknown"` and
# `version_verified = false` record that honestly. The sha256 below is real,
# computed from the files on disk; that is what this manifest can actually
# guarantee (byte-identity from this commit forward), whatever the exact
# upstream revision.

[[asset]]
name = "ibm-plex-sans-400"
version = "unknown"
version_verified = false         # no static woff2 exists upstream to compare against — see block comment above
modified = true                  # instanced (variable TTF -> static weight) + converted to woff2, not a copy
path = "docs/fonts/ibm-plex-sans-400.woff2"
sha256 = "d6073f2eaec194daadd914349424b402eef5fe61e09cc5f2c9792f61b1d42d18"
license = "docs/fonts/OFL-ibm-plex-sans.txt"

