# Vendored third-party web assets — the single source of truth for what is
# checked into docs/ from outside this project.
#
# Why this file exists. Three libraries are vendored into the docs site so the
# published pages make no third-party CDN request: KaTeX, GLightbox, and (as of
# 2026-08-13) mermaid. Until now the only record of WHICH version each one was
# lived in prose comments in zensical.toml, and nothing verified that the files
# on disk still matched. A vendored asset with no recorded provenance is
# strictly worse than a CDN reference: you cannot tell what it is, whether it
# has been modified, or whether it carries a known vulnerability.
#
# `sha256` is the authoritative field. It is what `scripts/check_vendored_assets.py`
# enforces on every run, offline, and it catches a truncated download, a hand
# edit, or a silent replacement. `version` is metadata: useful for deciding when
# to upgrade, but only as trustworthy as `version_verified` says it is.
#
# Adding or upgrading an asset:
#   1. download it from the pinned `url`
#   2. `uv run python scripts/check_vendored_assets.py --update` to rewrite the
#      hashes from what is now on disk
#   3. review the diff — an unexpected hash change is the whole point of this file
#
# `--check-upstream` re-fetches each pinned URL and compares. It is opt-in and
# never runs in the default check, so CI does not depend on npm being reachable
# and an upstream release is information rather than a red pipeline.

[[asset]]
name = "mermaid"
version = "11.16.1"
version_verified = true          # downloaded from this exact pinned URL, 2026-08-13
url = "https://unpkg.com/mermaid@11.16.1/dist/mermaid.min.js"
path = "docs/javascripts/mermaid.min.js"
sha256 = "18327bef70d96fb505fe7287d9f6a7362ebf07ff6576ddfaffb1a06f3e1a2954"
license = "docs/javascripts/mermaid.LICENSE"
# Vendored specifically to stop the docs executing an UNPINNED major: Zensical's
# bundle fetched `unpkg.com/mermaid@11` at page load, so every reader ran
# whatever upstream had published that day. Vendoring also enables the
# `sf-mermaid` fence rename — the bundle used the `.mermaid` class as its
# trigger to fetch mermaid, so the rename would otherwise leave it unloaded.
notes = "3.4 MB; the largest vendored asset by far, and the price of not running an unpinned CDN major"

[[asset]]
name = "katex"
version = "0.18.1"
version_verified = true          # sha256 matches unpkg katex@0.18.1, checked 2026-08-13
url = "https://unpkg.com/katex@0.18.1/dist/katex.min.js"
path = "docs/javascripts/katex.min.js"
sha256 = "68b9115510b8cedb9909a10de7799c94c0707481296f755c0a8888cb8fcde216"
license = ""                     # upstream LICENSE not vendored alongside — see below
# RESOLVED 2026-08-13. The earlier probe searched 0.16.8-0.16.22 and found no
# match, because it was searching the wrong minor line entirely: the bundle
# self-reports `version:"0.18.1"` internally, and a direct hash comparison
# against unpkg katex@0.18.1 matches exactly. The lesson is worth keeping —
# the probe was bounded by an assumption ("it is 0.16.x") inherited from a
# zensical.toml prose comment, so it could only ever confirm or fail to
# confirm that assumption, never correct it.
# Upstream latest at the time of writing is 0.18.4, so this is three patch
# releases behind. Not urgent, and deliberately not bumped as part of a
# provenance fix: changing bytes and recording what the bytes are should be
# two separate commits.
# Still open: vendor the upstream LICENSE beside it, as mermaid and GLightbox
# have. The sha256 pins the bytes regardless.

[[asset]]
name = "katex-auto-render"
version = "0.18.1"
version_verified = true          # sha256 matches unpkg katex@0.18.1, checked 2026-08-13
url = "https://unpkg.com/katex@0.18.1/dist/contrib/auto-render.min.js"
path = "docs/javascripts/katex-auto-render.min.js"
sha256 = "e5372d199bcdae8b4de71d0f7ceba72a4ba12774a27c60a6f1f77d03b3228ee4"
license = ""
notes = "ships with katex; must stay on the same version as katex.min.js"

[[asset]]
name = "katex-css"
version = "0.18.1"
version_verified = true          # provenance confirmed via the katex.min.js it ships with
modified = true                  # see notes — this file is a DERIVATIVE, not a copy
url = "https://unpkg.com/katex@0.18.1/dist/katex.min.css"
path = "docs/stylesheets/katex.min.css"
sha256 = "46a93d0090b5625b84849f5c4b8fc7439f97f5aa07fec00c684c24593f6dd208"
license = "docs/fonts/katex/LICENSE"
# DELIBERATE DERIVATIVE — do not "fix" the hash mismatch by re-downloading.
# Upstream declares each font three times (ttf/woff/woff2) at `fonts/KaTeX_*`;
# this copy is rewritten to a woff2-only subset at `../fonts/katex/KaTeX_*`,
# pointing at the fonts vendored under docs/fonts/katex/. That is what makes
# the page render without a CDN font fetch, and it is why the file is 22773
# bytes against upstream's 24727.
# So `--check-upstream` reports this one as DIFFERING and that is CORRECT.
# `modified = true` records the intent, so a future reader finds a documented
# derivative rather than apparent drift.
notes = "woff2-only font subset with paths rewritten to docs/fonts/katex/; hash will NOT match upstream by design"

