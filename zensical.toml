# ============================================================================
# spectrafit-core documentation site — built with Zensical
# (https://zensical.org). See docs/contributor-guide/architecture.md for the
# broader project structure; this file only configures the docs site itself.
#
# NOTE: config keys are declared at the TOP LEVEL (site_name, nav, [theme],
# [markdown_extensions.*], [[plugins]]) rather than nested under a [project]
# table. Zensical's own bootstrap template nests everything under [project],
# and both forms parse without error — but empirically, on the installed
# 0.0.51 build, the [project]-nested form silently breaks the mkdocstrings
# markdown-extension wiring: the plugin loads, no error/warning is raised
# (even with `zensical build --strict`), but `::: spectrafit_core.xxx`
# directives render as literal text instead of real API docs. Verified by
# bisecting a minimal repro (bare keys -> renders; [project]-nested,
# otherwise identical -> does not). Keep this file in the flat form.
# ============================================================================

site_name = "spectrafit-core"
site_description = "A Rust-accelerated, Python-first spectral fitting library — solvers, model composition, and a benchmark/verification harness."
site_author = "spectrafit-core contributors"
# site_url intentionally unset until the GitLab Pages docs URL is finalized
# (see .gitlab/60-pages.yml — the new `build:docs` job wires this).

# Drives the repo icon/link in the header on both published mirrors (GitHub
# Pages and GitLab Pages now both serve the docs from their domain root).
# Zensical auto-derives repo_name ("GitHub") and the header icon from the host.
repo_url = "https://github.com/Anselmoo/spectrafit-core"

copyright = """
Copyright &copy; 2026 spectrafit-core contributors
"""

extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Performance" = "performance/index.md" },
  { "Getting Started" = [
    "getting-started/index.md",
    { "Installation" = "getting-started/installation.md" },
    { "Quickstart" = "getting-started/quickstart.md" },
  ] },
  { "Tutorials" = [
    "tutorials/gallery/index.md",
    { "Single-dataset fitting" = "tutorials/gallery/fitting.md" },
    { "N-D fitting" = "tutorials/gallery/3d_fitting.md" },
    { "Multi-dataset joint fitting" = "tutorials/gallery/multi_dataset.md" },
    { "Shared / tied parameters" = "tutorials/gallery/shared_params.md" },
  ] },
  { "How-to guides" = [
    "how-to/index.md",
    { "Choosing a solver" = "how-to/choosing-a-solver.md" },
    { "Adding a model" = "how-to/adding-a-model.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "Python: core API" = "reference/python/core-api.md" },
    { "Python: shape factories" = "reference/python/shape-factories.md" },
    { "Rust: crate overview" = "reference/rust/overview.md" },
    { "Model formulas" = "reference/models/index.md" },
  ] },
  { "Explanation" = [
    "explanation/index.md",
    { "Model composition (DAG IR)" = "explanation/model-composition-dag.md" },
    { "Parameter model" = "explanation/parameter-model.md" },
    { "Solver selection" = "explanation/solver-selection.md" },
  ] },
  { "Contributor Guide" = [
    "contributor-guide/index.md",
    { "Setup" = "contributor-guide/setup.md" },
    { "Architecture" = "contributor-guide/architecture.md" },
    { "GitHub mirror workflow" = "contributor-guide/github-mirror-workflow.md" },
    { "Benchmark engine (internal)" = "contributor-guide/benchmark-engine.md" },
    { "Web dashboard" = "contributor-guide/web-dashboard.md" },
    { "Code of Conduct" = "contributor-guide/code-of-conduct.md" },
  ] },
  { "Release Notes" = "release-notes/changelog.md" },
  { "Security" = "security.md" },
  { "Limitations" = "limitations.md" },
]

[theme]
language = "en"
# Shared brand mark: a glass-inspired squircle mark (systemBlue/systemIndigo
# gradient background, a frosted backdrop layer, an off-axis specular
# glint, a lifted foreground glyph, plus a small corner badge marking this
# specifically as the spectrafit-core variant) used by the benchmark
# dashboard's favicon (web/public/favicon.svg, kept byte-identical — see
# DECISIONS.md's icon-redesign entry), also referenced in docs/images/ so
# both sites maintain visual identity.
#
# Deliberately described as "glass-inspired," not "Liquid Glass" in Apple's
# literal technical sense: real Liquid Glass is a dynamic material the
# system renders at draw time (Icon Composer + OS-level specular/
# refraction, confirmed via Apple's own live HIG documentation) — a static
# SVG favicon has no equivalent pipeline, so this is a static aesthetic
# approximation of that material's spirit, not an implementation of it.
#
# theme.logo and theme.favicon are genuinely separate, independently
# settable keys (confirmed via Zensical's own docs) — deliberately kept
# identical here rather than diverged: the icon already reads correctly
# at both header-logo scale and 16px favicon scale, and a second asset
# would just be a third variant to keep in sync across dashboard + docs +
# browser tab for a difference that doesn't currently need one.
favicon = "images/favicon.svg"
logo = "images/favicon.svg"
custom_dir = "overrides"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "toc.follow",
  "search.highlight",
]

[[theme.palette]]
scheme = "default"
# "custom" is Material/Zensical's documented escape hatch for exact brand hex
# (see <https://zensical.org/docs/setup/colors/>): it signals the theme that
# --md-primary-fg-color/--md-accent-fg-color will be supplied via CSS, rather
# than picking the nearest named color slug. The actual systemBlue/systemIndigo
# hex values live in docs/stylesheets/tokens/palette.css, scoped under
# Material's own [data-md-color-scheme] toggle attribute.
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ----------------------------------------------------------------------------
# Markdown extensions
# ----------------------------------------------------------------------------
[markdown_extensions.abbr]
[markdown_extensions.admonition]
[markdown_extensions.attr_list]
[markdown_extensions.def_list]
[markdown_extensions.footnotes]
[markdown_extensions.md_in_html]
[markdown_extensions.toc]
permalink = true
[markdown_extensions.pymdownx.betterem]
[markdown_extensions.pymdownx.caret]
[markdown_extensions.pymdownx.details]
# emoji + keys: Zensical's own documented defaults (see the header comment's
# audit note), added here since they were previously absent — audited
# 2026-07-26 against <https://zensical.org/docs/setup/extensions/about/>.
# `pymdownx.emoji` also backs Material's `:material-...:`/`:lucide-...:` icon
# shortcode syntax, so it's needed the first time a page reaches for one, not
# just for literal emoji. `emoji_generator`/`emoji_index` mirror Zensical's
# own default (twemoji index, SVG generator) rather than upstream Material's.
[markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[markdown_extensions.pymdownx.keys]
[markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[markdown_extensions.pymdownx.inlinehilite]
[markdown_extensions.pymdownx.magiclink]
[markdown_extensions.pymdownx.mark]
[markdown_extensions.pymdownx.smartsymbols]
[markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[markdown_extensions.pymdownx.tilde]
# NOT enabled (deliberately): pymdownx.arithmatex. It's in Zensical's own
# default extension set and would be a real fit for a peak-fitting library's
# formula-heavy docs, but rendering it needs extra_javascript (a MathJax or
# KaTeX CDN script) that has no current consumer — zero pages use `$$...$$`
# today (verified via a repo-wide grep, 2026-07-26). Wire it when the model
# formulas / gallery content actually needs LaTeX math, alongside the
# MathJax-vs-KaTeX + CDN-vs-vendored decision, rather than half-enabling an
# extension with nothing to render.
# pymdownx.snippets: lets thin pages (security.md, limitations.md, the
# release-notes/changelog.md mirror, and the gallery .md/.py pairing) include
# content from repo-root files and from the gallery scripts themselves
# instead of hand-copying prose that then drifts (see the fitting.md/
# fitting.py copy-paste-drift precedent this replaces).
[markdown_extensions.pymdownx.snippets]
base_path = [".", "docs/tutorials/gallery"]
check_paths = true

# ----------------------------------------------------------------------------
# Plugins
# ----------------------------------------------------------------------------
[[plugins]]
search = {}

[[plugins]]
mkdocstrings = {}
