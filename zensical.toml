[theme]
language = "en"
# `false` suppresses Zensical's Google Fonts block entirely (base.html's
# `{% if config.theme.font != false %}`). Without it, the `modern` variant
# defaults to {text = "Inter", code = "JetBrains Mono"} and every page emits a
# `preconnect` to fonts.gstatic.com plus a stylesheet request to
# fonts.googleapis.com — on a site that already self-hosts those exact OFL
# faces in docs/fonts/, byte-identical to web/src/style/fonts/.
#
# It also injected `:root{--md-text-font:"Inter"}`, which is why `document.body`
# and everything the per-selector overrides in stylesheets/typography/type.css
# missed — the footer nav, the skip link, both tooltip variants — rendered in
# Inter while the article rendered in IBM Plex Sans. The families are now set as
# tokens in stylesheets/tokens/palette.css instead, so the cascade has a single
# source rather than a default that must be out-fought selector by selector.
font = false
# Shared brand mark: a glass-inspired squircle mark (systemBlue/systemIndigo
# gradient background, a frosted backdrop layer, an off-axis specular
# glint, a lifted foreground glyph, plus a small corner badge marking this
# specifically as the spectrafit-core variant) used by the benchmark
# dashboard's favicon (web/public/favicon.svg, kept byte-identical — see
# DECISIONS.md's icon-redesign entry), also referenced in docs/images/ so
# both sites maintain visual identity.
#
# Deliberately described as "glass-inspired," not "Liquid Glass" in Apple's
# literal technical sense: real Liquid Glass is a dynamic material the
# system renders at draw time (Icon Composer + OS-level specular/
# refraction, confirmed via Apple's own live HIG documentation) — a static
# SVG favicon has no equivalent pipeline, so this is a static aesthetic
# approximation of that material's spirit, not an implementation of it.
#
# theme.logo and theme.favicon are genuinely separate, independently
# settable keys (confirmed via Zensical's own docs) — deliberately kept
# identical here rather than diverged: the icon already reads correctly
# at both header-logo scale and 16px favicon scale, and a second asset
# would just be a third variant to keep in sync across dashboard + docs +
# browser tab for a difference that doesn't currently need one.
favicon = "images/favicon.svg"
logo = "images/favicon.svg"
custom_dir = "overrides"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # Thin progress bar during instant-nav page loads — instant navigation
  # otherwise gives zero feedback while the next page fetches (a real gap:
  # Tog's "no silent state change" principle), and this is Zensical's own
  # documented answer to exactly that, not a new mechanism of our own.
  "navigation.instant.progress",
  "navigation.path",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "toc.follow",
  "search.highlight",
  # header.autohide and announce.dismiss were evaluated and deliberately NOT
  # added (see docs/stylesheets/components/header.css's header comment) —
  # don't re-add without re-litigating those reasons. search.suggest and
  # search.share were checked against Zensical's own docs (2026-08-01, three
  # separate queries) and don't appear to exist in the current build at all
  # — not Material-parity gaps worth chasing yet, just unimplemented.
]

[[theme.palette]]
scheme = "default"
# "custom" is Material/Zensical's documented escape hatch for exact brand hex
# (see <https://zensical.org/docs/setup/colors/>): it signals the theme that
# --md-primary-fg-color/--md-accent-fg-color will be supplied via CSS, rather
# than picking the nearest named color slug. The actual systemBlue/systemIndigo
# hex values live in docs/stylesheets/tokens/palette.css, scoped under
# Material's own [data-md-color-scheme] toggle attribute.
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ----------------------------------------------------------------------------
# Markdown extensions
# ----------------------------------------------------------------------------
[markdown_extensions.abbr]
[markdown_extensions.admonition]
[markdown_extensions.attr_list]
[markdown_extensions.def_list]
[markdown_extensions.footnotes]
[markdown_extensions.md_in_html]
[markdown_extensions.toc]
permalink = true
[markdown_extensions.pymdownx.betterem]
[markdown_extensions.pymdownx.caret]
[markdown_extensions.pymdownx.details]
# emoji + keys: Zensical's own documented defaults (see the header comment's
# audit note), added here since they were previously absent — audited
# 2026-07-26 against <https://zensical.org/docs/setup/extensions/about/>.
# `pymdownx.emoji` also backs Material's `:material-...:`/`:lucide-...:` icon
# shortcode syntax, so it's needed the first time a page reaches for one, not
# just for literal emoji. `emoji_generator`/`emoji_index` mirror Zensical's
# own default (twemoji index, SVG generator) rather than upstream Material's.
[markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[markdown_extensions.pymdownx.keys]
[markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[markdown_extensions.pymdownx.inlinehilite]
[markdown_extensions.pymdownx.magiclink]
[markdown_extensions.pymdownx.mark]
[markdown_extensions.pymdownx.smartsymbols]
[markdown_extensions.pymdownx.superfences]
# `class = "sf-mermaid"`, NOT "mermaid" — and this reverses an earlier decision,
# so the reasoning matters.
#
# Zensical's bundle acts on any element with the literal class "mermaid": it
# replaces the `<pre>` with an empty `<div>` and drives mermaid itself. That
# renderer does not work here — with our own script removed entirely and the
# builtin left to run alone, all three diagrams on contributor-guide/
# architecture/ produced empty divs, zero SVG, and no console error (tested
# 2026-08-13, both locally and against the deployed site). It has never worked;
# the diagrams have never rendered in production.
#
# Renaming was tried once before and reverted, because the bundle also uses that
# class as the trigger to fetch mermaid.js from unpkg — rename it and mermaid
# never loads at all. That objection is now void: mermaid.min.js is vendored in
# docs/javascripts/ (see extra_javascript) exactly as KaTeX and GLightbox
# already are, so nothing depends on the bundle to load it.
#
# With the rename, the bundle never sees a `.mermaid` element, leaves our
# `<pre class="sf-mermaid">` untouched, and mermaid-init.js reads the source
# straight from the DOM. That removed a build step (the JSON-payload injector
# written to survive the bundle's rewriting) and the load-order race with it.
custom_fences = [
  { name = "mermaid", class = "sf-mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[markdown_extensions.pymdownx.tilde]
# Enabled 2026-08-02: reference/models/index.md's 34 model formulas moved
# from unicode-glyph approximations to real LaTeX ($...$), the first
# consumer. `generic = true` emits MathJax/KaTeX-compatible \(...\) / \[...\]
# markup (Zensical's own default for this extension) rather than a
# MathJax-Preview-specific format. Rendered by vendored KaTeX (docs/fonts/katex/,
# docs/javascripts/katex*.js — see extra_javascript below and
# docs/stylesheets/components/katex.css), not a MathJax CDN script: this repo
# already self-hosts its body/code fonts specifically to avoid third-party
# font/script requests (see theme.font = false above), and a CDN math script
# would be the first exception to that. cupertino-council pass on record in
# docs/stylesheets/components/katex.css's own header comment.
[markdown_extensions.pymdownx.arithmatex]
generic = true
# pymdownx.snippets: lets thin pages (security.md, limitations.md, the
# release-notes/changelog.md mirror, and the gallery .md/.py pairing) include
# content from repo-root files and from the gallery scripts themselves
# instead of hand-copying prose that then drifts (see the fitting.md/
# fitting.py copy-paste-drift precedent this replaces).
[markdown_extensions.pymdownx.snippets]
base_path = [".", "docs/tutorials/gallery"]
check_paths = true
# auto_append: injects docs/includes/abbreviations.md's `*[TERM]: definition`
# tooltip lines into every page (markdown_extensions.abbr, enabled above,
# renders them as dotted-underline hover text) without a per-page snippet import.
auto_append = ["docs/includes/abbreviations.md"]

# ----------------------------------------------------------------------------
# Plugins
# ----------------------------------------------------------------------------
# NOT enabled (deliberately, checked 2026-08-02): a Material-style `tags`
# plugin. The installed Zensical build has no such plugin — `zensical/extensions/`
# ships autorefs/context/emoji/glightbox/links/macros/mkdocstrings/preview/search
# only, and `config.py`'s `_convert_plugins` special-cases just `search`,
# `offline`, and `mike`. `templates/partials/tags.html` exists (a verbatim,
# unmodified copy of Material's template, gated on `{% if tags %}`) but nothing
# in Zensical ever populates `tags`, so it would silently render nothing.
# Building a custom tags plugin for this is disproportionate to the ask;
# revisit only if Zensical ships one upstream. `abbr` (below) already covers
# the term-tooltip use case at a fraction of the effort.
[[plugins]]
search = {}

[[plugins]]
glightbox = {}

[[plugins]]
mkdocstrings = {}
