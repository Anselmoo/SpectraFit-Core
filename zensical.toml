# ============================================================================
# spectrafit-core documentation site — built with Zensical
# (https://zensical.org). See docs/contributor-guide/architecture.md for the
# broader project structure; this file only configures the docs site itself.
#
# NOTE: config keys are declared at the TOP LEVEL (site_name, nav, [theme],
# [markdown_extensions.*], [[plugins]]) rather than nested under a [project]
# table. Zensical's own bootstrap template nests everything under [project],
# and both forms parse without error — but empirically, on the installed
# 0.0.51 build, the [project]-nested form silently breaks the mkdocstrings
# markdown-extension wiring: the plugin loads, no error/warning is raised
# (even with `zensical build --strict`), but `::: spectrafit_core.xxx`
# directives render as literal text instead of real API docs. Verified by
# bisecting a minimal repro (bare keys -> renders; [project]-nested,
# otherwise identical -> does not). Keep this file in the flat form.
# ============================================================================

site_name = "SpectraFit-Core"
site_description = "A Rust-accelerated, Python-first spectral fitting library — solvers, model composition, and a benchmark/verification harness."
site_author = "spectrafit-core contributors"
# site_url intentionally unset until the GitLab Pages docs URL is finalized
# (see .gitlab/60-pages.yml — the new `build:docs` job wires this).

# Drives the repo icon/link in the header on both published mirrors.
# 2026-08-04 correction: this comment used to claim "GitHub Pages and GitLab
# Pages both serve the docs from their domain root" — false for GitHub.
# GitLab Pages serves this project at its own unique per-project domain
# (spectrafit-core-<hash>.pages.mpcdf.de, no subpath) via
# `is_unique_domain_enabled`, so root-absolute links there are correct — but
# GitHub Pages serves Anselmoo/SpectraFit-Core as an ordinary PROJECT page
# under /SpectraFit-Core/ (no CNAME/custom domain configured), so a
# root-absolute link 404s there. CI-assembled links (report.html, rust-api/,
# web/, reports/ — see tests/audit/test_audit_built_site_links.py's
# `_CI_ASSEMBLED`) must be page-relative (`../report.html` etc.), not
# root-absolute, to work on both. Confirmed live: all four root-absolute
# forms 404'd on GitHub Pages before this fix.
# Zensical auto-derives repo_name ("GitHub") and the header icon from the host.
repo_url = "https://github.com/Anselmoo/spectrafit-core"
# Backs content.action.edit/.view below. GitHub is a disposable, periodically
# force-pushed mirror (see contributor-guide/github-mirror-workflow.md) — but
# a non-collaborator clicking "Edit this page" gets GitHub's own fork+PR flow,
# not a direct commit to the mirror, so the edit itself isn't at risk from the
# next squash-push (user-confirmed 2026-08-01: only a maintainer with direct
# push access could race the mirror, and that's already a known, accepted
# risk of using GitHub as a mirror at all, not a new one this introduces).
edit_uri = "edit/main/docs/"

copyright = """
Copyright &copy; 2026 spectrafit-core contributors
"""

extra_css = [
  "stylesheets/extra.css",
  # Vendored KaTeX stylesheet (woff2-only font subset, trimmed from the
  # upstream npm `katex` package's dist/katex.min.css — see
  # docs/fonts/katex/LICENSE for provenance). Kept separate from the
  # extra.css @import manifest since it's third-party, not a manifest module.
  "stylesheets/katex.min.css",
  # Vendored GLightbox stylesheet (v3.3.1, from npm `glightbox`'s
  # dist/css/glightbox.min.css — see docs/javascripts/glightbox.LICENSE for
  # provenance), same "no third-party CDN request" rationale as KaTeX above.
  # The `glightbox = {}` plugin below wraps gallery images in
  # `<a class="glightbox">` anchors; Zensical's bundled runtime (not this
  # config) is what actually loads GLightbox's JS/CSS to power those anchors,
  # and its shipped default (0.0.52) fetches both from unpkg.com the moment a
  # page has any `.glightbox` element — see extra_javascript below for why
  # vendoring only closes half of that.
  "stylesheets/glightbox.min.css",
]

# Vendored KaTeX (not a MathJax/KaTeX CDN script) + a small init script that
# subscribes to Zensical's `document$` instant-navigation observable so math
# re-renders on every client-side page swap, not just the first page load.
# Order matters: katex.min.js defines the `katex` global auto-render.min.js
# needs; katex-init.js calls the `renderMathInElement` global auto-render
# defines.
extra_javascript = [
  "javascripts/katex.min.js",
  "javascripts/katex-auto-render.min.js",
  "javascripts/katex-init.js",
  # Vendored mermaid (11.16.1, from npm `mermaid`'s dist/mermaid.min.js — see
  # docs/javascripts/mermaid.LICENSE, and scripts/vendored_assets.toml for the
  # pinned version and hash). Same "no third-party CDN request" rationale as
  # KaTeX and GLightbox above, with one addition specific to this asset: the
  # bundle's own fetch was `unpkg.com/mermaid@11`, an UNPINNED major, so the
  # published docs executed whatever upstream shipped that day.
  #
  # Vendoring is also what allows the `sf-mermaid` fence rename below: the
  # bundle only fetched mermaid.js when it saw a `.mermaid` element, so the
  # rename would otherwise leave mermaid unloaded. Order matters —
  # mermaid.min.js defines the `window.mermaid` that mermaid-init.js drives.
  "javascripts/mermaid.min.js",
  # Renders the fences itself rather than leaving it to Zensical's bundle,
  # which produces empty containers (see zensical.toml's custom_fences note
  # and this file's own header for the full diagnosis).
  "javascripts/mermaid-init.js",
  # Vendored GLightbox runtime (v3.3.1, from npm `glightbox`'s
  # dist/js/glightbox.min.js — see docs/javascripts/glightbox.LICENSE),
  # loaded as a plain UMD script so it sets the `window.GLightbox` global.
  # Read from Zensical's own installed `bundle.*.min.js` (0.0.52): its
  # lightbox opener checks `typeof GLightbox=="undefined"` before fetching
  # `https://unpkg.com/glightbox@3/dist/js/glightbox.min.js`, so predefining
  # the global here pre-empts that fetch. There is no equivalent guard on
  # the CSS side — the same bundled code unconditionally injects a
  # `<link rel=stylesheet>` to `unpkg.com/glightbox@3/dist/css/*` the moment
  # a page has a `.glightbox` element, and neither `zensical.toml` nor the
  # `glightbox` plugin's config schema (zensical/extensions/glightbox.py's
  # `GlightboxConfig`) exposes a switch for it — confirmed by reading both
  # the installed extension source and the minified bundle, not guessed.
  # This is the same category of gap as mermaid.js's own CDN fetch
  # (docs/javascripts/mermaid-init.js's header comment): a Zensical-runtime
  # behavior this repo cannot fully turn off from its own config, made
  # harmless rather than eliminated by itself, so glightbox-init.js
  # (below) closes it: it rewrites that CDN `<link>`'s href to the
  # already-loaded vendored stylesheet instead of dropping it, since
  # Zensical's loader waits on the link's `load` event before wiring up
  # the lightbox — see that file's header comment for the full trace.
  "javascripts/glightbox.min.js",
  "javascripts/glightbox-init.js",
]

