# Lint stage — cheap checks that surface obvious drift before the expensive tests.
# Cycle 31: NEEDS_BUILD_DEPS removed — cmake/gfortran/mold are baked into the
# CI image. Each job declares only the cache bucket(s) it needs.
#
# Cycle 31 hotfix 8: all rust-* caches are now .cargo/-only (no target/).
# Pipeline #18 ENOSPC mid-rustc forced the change; each Rust job rebuilds from
# a warm cargo registry. Cost: ~2-3 min per Rust job; benefit: bounded disk.

lint:python:
  rules: !reference [.rules_default, rules]
  stage: lint
  needs: [setup]
  cache:
    - key: "static-$CI_COMMIT_REF_SLUG"
      paths:
        - .uv-cache/
        - .venv/
      policy: pull
  script:
    - |
      # `--no-sync` skips uv's default-re-resolve-on-run, which would otherwise
      # try to install the local spectrafit-core editable wheel (triggering
      # maturin → netlib-src → cmake). The .venv artifact from setup already
      # has ruff + ty + every dep; lint:python just runs the binaries.
      #
      # `ruff format --check` was added after a formatting drift in tests/
      # (120 files) went undetected here for a long time — this job only ran
      # `ruff check` (lint rules) and `ty check`, never format-checking, even
      # though `.pre-commit-config.yaml` configures a `ruff-format` hook.
      # GitHub's Pre-Commit Check workflow runs the full local hook set
      # (including ruff-format) and was the only thing that ever caught the
      # drift — but only on the PRs/pushes that trigger it: push to main,
      # Dependabot PRs, or a PR opened by an existing owner/member/collaborator
      # (see .github/workflows/pre-commit-check.yml's `if:` condition; the
      # latter is what CONTRIBUTING.md's "Fast iteration on GitHub" lane relies
      # on, so this is not as rare as "Dependabot's" alone implies).
      UV_CACHE_DIR=.uv-cache uv run --no-sync ruff format --check .
      UV_CACHE_DIR=.uv-cache uv run --no-sync ruff check .
      UV_CACHE_DIR=.uv-cache uv run --no-sync ty check python/oracles python/spectrafit_core
      # Pure-Python, no build needed -- catches unbalanced $ delimiters, bare
      # | inside table-cell math, and plain-text formula notation drifted out
      # of sync with reference/models/index.md's real LaTeX.
      UV_CACHE_DIR=.uv-cache uv run --no-sync poe audit_latex
      # Regenerate-then-diff (mirrors the GitHub ci.yml lint job's equivalent
      # step): `.rrt/tree.lock.toml` is a same-run scratch artifact (gitignored,
      # not committed) -- the check is whether regenerating
      # contributor-guide/architecture.md's injected tree block changes the
      # committed file.
      UV_CACHE_DIR=.uv-cache uv run --no-sync rrt tree --root . --max-depth 2 --snapshot
      UV_CACHE_DIR=.uv-cache uv run --no-sync python scripts/render_architecture_tree.py
      git diff --exit-code docs/contributor-guide/architecture.md \
        || (echo "architecture.md's directory tree is stale -- run 'rrt tree --root . --max-depth 2 --snapshot && uv run python scripts/render_architecture_tree.py'" && exit 1)

lint:rust:
  rules: !reference [.rules_default, rules]
  stage: lint
  needs: [setup]
  # ci-job-timeout-declaration: every cold-compiling job declares an explicit
  # timeout, matching test:python:rust-cov / test:python:pytest / build:report_html*
  # / benchmark:deep. clippy compiles the workspace (~5 min warm, measured
  # pipeline 363865) -- 2h is the same headroom those siblings carry, not sized
  # tighter just because this job is normally fast.
  timeout: 2h
  cache:
    - key: "rust-$CI_COMMIT_REF_SLUG"
      paths:
        - .cargo/
      # Cycle 31 hotfix 8: target/ removed from the rust-* cache pipeline-wide.
      # Pulling a 1-2 GB target/ + writing it back on every job overflowed GWDG
      # runner disk in pipeline #18 (ENOSPC mid-rustc on `syn`/`serde_derive`).
      # Each job rebuilds from a warm cargo registry; .cargo/ alone is small
      # and high-value. The clippy → test:rust target/ warm-handoff is gone,
      # but test:rust under hotfix 8 also no longer pulls target/, so the
      # handoff was dead weight anyway.
      policy: pull
  script:
    - |
      # `cargo fmt --check` was added after the same class of gap already fixed
      # in lint:python's `ruff format --check` (see that job's comment): this
      # job only ran clippy, never format-checking, even though
      # `.pre-commit-config.yaml` configures a `cargo-fmt` hook. GitHub's
      # Pre-Commit Check workflow (full local hook set) was the only thing
      # that ever caught ~40 files of rustfmt drift accumulated across the
      # workspace — same root cause, different language.
      #
      # The baked CI image's toolchain has `clippy` (this job's prior sole
      # check) but not `rustfmt` — `rustup component add` is idempotent and
      # fast (no image rebuild needed) when the component is already present.
      rustup component add rustfmt
      cargo fmt --all -- --check
      cargo clippy --workspace --all-targets -- -D warnings
      # House rule 14: this job must stay a superset of .pre-commit-config.yaml.
      # `crate-conventions` gates house rules 22 and 26 — a new crate missing
      # `[lints] workspace = true` is silently exempt from the workspace
      # unsafe_code deny, and a new `pub mod` defeats the curated re-export
      # boundary. Pure-Python, no cargo build needed, so it costs ~0s here.
      python3 scripts/check_crate_conventions.py

lint:ci:
  # House rule 14: this job must stay a superset of .pre-commit-config.yaml.
  # `shellcheck-ci` (scripts/shellcheck_ci.py, scoped to .gitlab/*.yml) had NO
  # GitLab-side equivalent at all -- only GitHub's Pre-Commit Check workflow
  # (full local hook set via `pre-commit run --all-files`) ever ran it, so
  # `.gitlab/*.yml` shell drift could accumulate for as long as no PR happened
  # to trigger that workflow (see .github/workflows/pre-commit-check.yml's
  # `if:` condition) before anything caught it. Root-caused 2026-08-04.
  rules: !reference [.rules_default, rules]
  stage: lint
  needs: [setup]
  cache:
    - key: "static-$CI_COMMIT_REF_SLUG"
      paths:
        - .uv-cache/
        - .venv/
      policy: pull
  script:
    - |
      # Pinned to the SAME shellcheck release GitHub installs
      # (.github/workflows/pre-commit-check.yml's "Install pinned ShellCheck"
      # step) -- a different release can disagree on whether a rule like
      # SC2015 fires, which otherwise makes a finding on one platform
      # unreproducible on the other. See .pre-commit-config.yaml's
      # `shellcheck-ci` entry for the version to install locally.
      SHELLCHECK_VERSION="0.11.0"
      SHELLCHECK_SHA256="8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
      curl -LsSf "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
        -o /tmp/shellcheck.tar.xz
      echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
      tar -xf /tmp/shellcheck.tar.xz -C /tmp
      install "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
      shellcheck --version
      UV_CACHE_DIR=.uv-cache uv run --no-sync python scripts/shellcheck_ci.py

lint:web:
  rules: !reference [.rules_default, rules]
  stage: lint
  needs: [setup]
  cache:
    - key: "web-$CI_COMMIT_REF_SLUG"
      paths:
        - web/node_modules/
      policy: pull
  script:
    - |
      cd web && npm run typecheck
